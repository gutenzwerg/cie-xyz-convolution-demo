      sampleButtons.innerHTML = "";
      Object.entries(lang.samples).forEach(([sample, label]) => {
        const button = document.createElement("button");
        button.id = sample + "Patch";
        button.textContent = label;
        sampleButtons.appendChild(button);
      });
    }

    function makeIlluminant(kind) {
      let s;
      if (typeof illuminants !== "undefined" && illuminants[kind]) {
        s = alignSpectrum(illuminants[kind]);
        return normalise(s.map(v => Math.max(0, v)));
      }
      if (kind === "FL") {
        s = wavelengths.map(l => 0.18 + gaussian(l, 436, 5, 0.95) + gaussian(l, 546, 7, 0.88) + gaussian(l, 611, 9, 0.72) + gaussian(l, 490, 35, 0.20));
      } else if (kind === "LED_WARM") {
        s = wavelengths.map(l => 0.08 + gaussian(l, 455, 17, 0.80) + gaussian(l, 610, 80, 1.05));
      } else if (kind === "LED_COOL") {
        s = wavelengths.map(l => 0.08 + gaussian(l, 450, 15, 1.15) + gaussian(l, 545, 70, 0.82));
      } else if (kind === "NARROW") {
        const peak = Number(document.getElementById("peakSlider").value);
        s = wavelengths.map(l => gaussian(l, peak, 7, 1.0));
      } else if (kind === "THEORETICAL_NARROW") {
        const peak = Number(document.getElementById("peakSlider").value);
        s = wavelengths.map(l => Math.abs(l - peak) <= STEP / 2 ? 1.0 : 0.0);
      } else {
        s = wavelengths.map(l => 1.0);
      }
      return normalise(s.map(v => Math.max(0, v)));
    }

    function setupCanvas(canvas) {
      const ratio = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(300, Math.round(rect.width * ratio));
      canvas.height = Math.max(180, Math.round(rect.height * ratio));
      const ctx = canvas.getContext("2d");
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function drawAxes(ctx, w, h, yMax = 1, labelY = "relative") {
      ctx.clearRect(0, 0, w, h);
      const padL = 46, padR = 16, padT = 14, padB = 34;
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid');
      ctx.lineWidth = 1;
      ctx.font = "12px system-ui";
      ctx.fillStyle = "#6b7280";
      for (let i = 0; i <= 5; i++) {
        const y = padT + i * (h - padT - padB) / 5;
        ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
      }
      for (let l = 400; l <= 700; l += 100) {
        const x = padL + (l - START) / (END - START) * (w - padL - padR);
        ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, h - padB); ctx.stroke();
        ctx.fillText(String(l), x - 10, h - 12);
      }
      ctx.strokeStyle = "#9ca3af";
      ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, h - padB); ctx.lineTo(w - padR, h - padB); ctx.stroke();
      ctx.fillText("λ / nm", w - 58, h - 12);
      ctx.fillText(labelY, 8, 18);
      return { padL, padR, padT, padB, plotW: w - padL - padR, plotH: h - padT - padB, yMax };
    }

    function drawCurve(canvas, curves, options = {}) {
      setupCanvas(canvas);
      const ctx = canvas.getContext("2d");
      const rect = canvas.getBoundingClientRect();
      const w = rect.width, h = rect.height;
      const maxVal = options.maxY || Math.max(1, ...curves.flatMap(c => c.data));
      const a = drawAxes(ctx, w, h, maxVal, options.labelY || "relative");
      curves.slice().sort((a,b) => {
        const aPriority = a.foreground ? 2 : (a.background ? 0 : 1);
        const bPriority = b.foreground ? 2 : (b.background ? 0 : 1);
        return aPriority - bPriority;
      }).forEach(c => {
        ctx.strokeStyle = c.color;
        ctx.lineWidth = c.width || 2.5;
        ctx.beginPath();

        if (c.discreteMode) {
          const barWidth = a.plotW / wavelengths.length;
          c.data.forEach((v, i) => {
            const x = a.padL + i / (wavelengths.length - 1) * a.plotW;
            const y = a.padT + (1 - Math.min(v / maxVal, 1)) * a.plotH;
            const baseY = a.padT + a.plotH;
            if (c.filledDiscrete) {
              ctx.fillStyle = c.fillColor || c.color;
              ctx.fillRect(x - barWidth * 0.45, y, barWidth * 0.9, baseY - y);
            } else {
              ctx.strokeStyle = c.color;
              ctx.lineWidth = c.width || 1.5;
              ctx.strokeRect(x - barWidth * 0.45, y, barWidth * 0.9, baseY - y);
            }
          });
        } else if (c.stepMode) {
          c.data.forEach((v, i) => {
            const x = a.padL + i / (wavelengths.length - 1) * a.plotW;
            const y = a.padT + (1 - Math.min(v / maxVal, 1)) * a.plotH;
            if (i === 0) ctx.moveTo(x, y);
            else {
              const prevY = a.padT + (1 - Math.min(c.data[i - 1] / maxVal, 1)) * a.plotH;
              ctx.lineTo(x, prevY);
              ctx.lineTo(x, y);
            }
          });
        } else {
          c.data.forEach((v, i) => {
            const x = a.padL + i / (wavelengths.length - 1) * a.plotW;
            const y = a.padT + (1 - Math.min(v / maxVal, 1)) * a.plotH;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          });
        }
        ctx.stroke();
      });

      if (options.legend) {
        let x = 58;
        options.legend.forEach(item => {
          ctx.strokeStyle = item.color;
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(x, 22); ctx.lineTo(x + 22, 22); ctx.stroke();
          ctx.fillStyle = "#374151";
          ctx.font = "13px system-ui";
          ctx.fillText(item.text, x + 28, 26);
          x += item.text.length * 8 + 58;
        });
      }
    }

    function compute() {
      const kind = document.getElementById("illuminant").value;
      const illum = makeIlluminant(kind);
      const xb = alignSpectrum(xbar);
      const yb = alignSpectrum(ybar);
      const zb = alignSpectrum(zbar);
      const stimulus = reflectance.map((r, i) => r * safeAt(illum, i));
      const xCurve = stimulus.map((v, i) => v * safeAt(xb, i));
      const yCurve = stimulus.map((v, i) => v * safeAt(yb, i));
      const zCurve = stimulus.map((v, i) => v * safeAt(zb, i));
      const sum = arr => arr.reduce((a, b) => a + (Number.isFinite(b) ? b : 0), 0) * STEP;
      const kindIsNarrow = kind === "NARROW" || kind === "THEORETICAL_NARROW";
      let k;
      if (kindIsNarrow) {
        const energy = sum(illum);
        k = energy > 0 ? 100 / energy : 0;
      } else {
        const denominator = sum(illum.map((s, i) => s * safeAt(yb, i)));
        k = denominator > 0 ? 100 / denominator : 0;
      }
      return {
        illum, stimulus, xCurve, yCurve, zCurve, xb, yb, zb,
        X: Number.isFinite(k) ? k * sum(xCurve) : 0,
        Y: Number.isFinite(k) ? k * sum(yCurve) : 0,
        Z: Number.isFinite(k) ? k * sum(zCurve) : 0
      };
    }

    function redraw() {
      const lang = t();
      const c = compute();
      const discrete = document.getElementById("discreteMode").checked;
      const isTheoretical = document.getElementById("illuminant").value === "THEORETICAL_NARROW";

      drawCurve(canvases.reflectance, [{ data: reflectance, color: "#6b7280", discreteMode: discrete, width: 1.5 }], { maxY: 1, labelY: "R" });
      drawCurve(canvases.illuminant, [{ data: c.illum, color: "#d97706", stepMode: isTheoretical, discreteMode: discrete }], { maxY: 1, labelY: "S" });
      drawCurve(canvases.stimulus, [
        { data: c.stimulus, color: "#2563eb", foreground: true, stepMode: isTheoretical, discreteMode: discrete },
        { data: reflectance, color: "#cbd5e1", width: 1.2, discreteMode: discrete },
        { data: c.illum, color: "#f59e0b", width: 1.2, stepMode: isTheoretical, discreteMode: discrete }
      ], { maxY: 1, labelY: "Φ", legend: [
        { text: lang.legendStimulus, color: "#2563eb" },
        { text: lang.legendReflectance, color: "#9ca3af" },
        { text: lang.legendLight, color: "#f59e0b" }
      ] });
      drawCurve(canvases.z, [
        { data: c.zCurve.map((v,i) => Math.min(v, c.zb[i])), color: "#2563eb", foreground: true, stepMode: isTheoretical, discreteMode: discrete },
        { data: c.zb, color: "#60a5fa", width: 1.0, discreteMode: discrete, filledDiscrete: true, background: true, fillColor: "#bfdbfe" }
      ], { maxY: Math.max(...c.zb) * 1.05, labelY: "Z", legend: [{ text: "Φ·z̄", color: "#2563eb" }] });
      drawCurve(canvases.y, [
        { data: c.yCurve.map((v,i) => Math.min(v, c.yb[i])), color: "#16a34a", foreground: true, stepMode: isTheoretical, discreteMode: discrete },
        { data: c.yb, color: "#4ade80", width: 1.0, discreteMode: discrete, filledDiscrete: true, background: true, fillColor: "#bbf7d0" }
      ], { maxY: 1, labelY: "Y", legend: [{ text: "Φ·ȳ", color: "#16a34a" }] });
      drawCurve(canvases.x, [
        { data: c.xCurve.map((v,i) => Math.min(v, c.xb[i])), color: "#dc2626", foreground: true, stepMode: isTheoretical, discreteMode: discrete },
        { data: c.xb, color: "#f87171", width: 1.0, discreteMode: discrete, filledDiscrete: true, background: true, fillColor: "#fecaca" }
      ], { maxY: Math.max(...c.xb) * 1.05, labelY: "X", legend: [{ text: "Φ·x̄", color: "#dc2626" }] });
      document.getElementById("xVal").textContent = c.X.toFixed(1);
      document.getElementById("yVal").textContent = c.Y.toFixed(1);
      document.getElementById("zVal").textContent = c.Z.toFixed(1);
    }

    function setReflectanceFromPointer(ev) {
      const canvas = canvases.reflectance;
      const rect = canvas.getBoundingClientRect();
      const x = Math.min(Math.max(ev.clientX - rect.left, 0), rect.width);
      const y = Math.min(Math.max(ev.clientY - rect.top, 0), rect.height);
      const padL = 46, padR = 16, padT = 14, padB = 34;
      const plotW = rect.width - padL - padR;
      const plotH = rect.height - padT - padB;
      const idx = Math.round(Math.min(Math.max((x - padL) / plotW, 0), 1) * (wavelengths.length - 1));
      const val = Math.min(Math.max(1 - (y - padT) / plotH, 0), 1);
      for (let j = -2; j <= 2; j++) {
        const k = idx + j;
        if (k >= 0 && k < reflectance.length) {
          const weight = 1 - Math.abs(j) / 3;
          reflectance[k] = reflectance[k] * (1 - weight) + val * weight;
        }
      }
      redraw();
    }

    function updatePeakControl() {
      const kind = document.getElementById("illuminant").value;
      const isNarrow = kind === "NARROW" || kind === "THEORETICAL_NARROW";
      document.getElementById("peakControl").classList.toggle("visible", isNarrow);
      document.getElementById("peakValue").textContent = document.getElementById("peakSlider").value + " nm";
    }

    function attachEvents() {
      canvases.reflectance.addEventListener("pointerdown", ev => { drawing = true; canvases.reflectance.setPointerCapture(ev.pointerId); setReflectanceFromPointer(ev); });
      canvases.reflectance.addEventListener("pointermove", ev => { if (drawing) setReflectanceFromPointer(ev); });
      canvases.reflectance.addEventListener("pointerup", () => { drawing = false; });
      canvases.reflectance.addEventListener("pointerleave", () => { drawing = false; });
      document.getElementById("illuminant").addEventListener("change", () => { updatePeakControl(); redraw(); });
      document.getElementById("discreteMode").addEventListener("change", redraw);
      document.getElementById("peakSlider").addEventListener("input", () => { updatePeakControl(); redraw(); });
      window.addEventListener("resize", redraw);

      document.getElementById("whitePatch").addEventListener("click", () => { reflectance = wavelengths.map(l => 1.0); redraw(); });
      document.getElementById("grayPatch").addEventListener("click", () => { reflectance = wavelengths.map(l => 0.45); redraw(); });
      document.getElementById("yellowPatch").addEventListener("click", () => {
        reflectance = wavelengths.map(l => Math.max(0.02, Math.min(0.94, 0.03 + 0.89 / (1 + Math.exp(-(l - 500) / 14)))));
        redraw();
      });
      document.getElementById("cyanPatch").addEventListener("click", () => {
        reflectance = wavelengths.map(l => {
          const redCutoff = 1 / (1 + Math.exp(-(l - 610) / 18));
          const blueSuppression = gaussian(l, 420, 24, 0.10);
          return Math.max(0.03, Math.min(0.82, 0.80 - 0.76 * redCutoff - blueSuppression));
        });
        redraw();
      });
      document.getElementById("magentaPatch").addEventListener("click", () => {
        reflectance = wavelengths.map(l => Math.max(0.05, Math.min(0.82, 0.72 - gaussian(l, 535, 42, 0.82) + gaussian(l, 640, 90, 0.12) + gaussian(l, 430, 55, 0.10))));
        redraw();
      });
      document.getElementById("bluePatch").addEventListener("click", () => { reflectance = wavelengths.map(l => Math.min(1, 0.18 + gaussian(l, 455, 45, 0.78) + gaussian(l, 690, 120, 0.10))); redraw(); });
      document.getElementById("redPatch").addEventListener("click", () => { reflectance = wavelengths.map(l => Math.min(1, 0.12 + gaussian(l, 635, 65, 0.82) + gaussian(l, 430, 70, 0.06))); redraw(); });
      document.getElementById("greenPatch").addEventListener("click", () => { reflectance = wavelengths.map(l => Math.min(1, 0.14 + gaussian(l, 535, 48, 0.75) + gaussian(l, 700, 90, 0.10))); redraw(); });
    }

    applyLanguage();
    attachEvents();
    updatePeakControl();
    redraw();
  </script>
</body>
</html>
